<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen Anual de Asistencia</title>
    <link rel="stylesheet" href="resumen-anual-asistencia.css">
</head>
<body>

    <div class="container">

        <!-- ============================================ -->
        <!-- ENCABEZADO                                    -->
        <!-- ============================================ -->
        <div class="header">
            <h1>📊 Resumen Anual de Asistencia</h1>
            <div class="header-info">
                <span class="badge" id="schoolYearDisplay">2025-2026</span>
                <span>Días trabajados: <span class="worked-days-badge" id="workedDaysDisplay">0</span></span>
            </div>
        </div>

        <!-- ============================================ -->
        <!-- CONTROLES                                     -->
        <!-- ============================================ -->
        <div class="controls">
            <!-- Información de Grado, Sección y Tanda -->
            <div class="info-group">
                <span class="info-label">📚 Grado:</span>
                <span class="info-value" id="currentGradeDisplay">3er Grado</span>
            </div>
            <div class="info-group">
                <span class="info-label">📝 Sección:</span>
                <span class="info-value" id="currentSectionDisplay">A</span>
            </div>
            <div class="info-group">
                <span class="info-label">🕐 Tanda:</span>
                <span class="info-value" id="currentTandaDisplay">Matutina</span>
            </div>

            <div class="divider"></div>

            <!-- Botones de Filas -->
            <button class="btn btn-success" id="addRowBtn">➕ Agregar Fila</button>
            <button class="btn btn-danger" id="deleteRowBtn">➖ Eliminar Fila</button>
            <span class="row-count-badge" id="rowCountDisplay">Filas: 45</span>

            <div class="divider"></div>

            <!-- Botones de Acción -->
            <button class="btn btn-primary" onclick="recalculateAttendance()">🔄 Recalcular</button>
            <button class="btn btn-secondary" onclick="printPage()">🖨️ Imprimir</button>
            <button class="btn btn-danger" onclick="clearAllData()">🗑️ Borrar Datos</button>
        </div>

        <!-- ============================================ -->
        <!-- NAVEGACIÓN SUPERIOR                          -->
        <!-- ============================================ -->
        <div style="display:flex; justify-content:center; margin-bottom:15px;">
            <div class="nav-container">
                <button class="nav-btn" id="prevBtn" onclick="changePage(-1)" title="Anterior">◀</button>
                <span class="page-indicator">
                    <span id="pageLabel">Hoja</span>: 
                    <span id="currentPage">1</span> de 
                    <span id="totalPages">2</span>
                </span>
                <button class="nav-btn" id="nextBtn" onclick="changePage(1)" title="Siguiente">▶</button>
            </div>
        </div>

        <!-- ============================================ -->
        <!-- CONTENEDOR DE TABLAS                         -->
        <!-- ============================================ -->
        <div id="annualAttendanceContainer"></div>

        <!-- ============================================ -->
        <!-- NAVEGACIÓN INFERIOR                          -->
        <!-- ============================================ -->
        <div style="display:flex; justify-content:center; margin-top:15px;">
            <div class="nav-container">
                <button class="nav-btn" id="prevBtn2" onclick="changePage(-1)" title="Anterior">◀</button>
                <span class="page-indicator">
                    <span id="pageLabel2">Hoja</span>: 
                    <span id="currentPage2">1</span> de 
                    <span id="totalPages2">2</span>
                </span>
                <button class="nav-btn" id="nextBtn2" onclick="changePage(1)" title="Siguiente">▶</button>
            </div>
        </div>

        <!-- ============================================ -->
        <!-- FOOTER                                       -->
        <!-- ============================================ -->
        <div class="footer">
            <span class="watermark">Ministerio de Educación • República Dominicana</span>
            <span class="page-number">Página 1 de 2</span>
        </div>

    </div>

    <!-- ============================================ -->
    <!-- MODAL                                        -->
    <!-- ============================================ -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-icon" id="modalIcon">⚠️</div>
            <h3 id="modalTitle">Confirmar</h3>
            <p id="modalMessage">¿Está seguro de que desea borrar todos los datos?</p>
            <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
                <button id="modalConfirmBtn" class="btn-danger-modal">Sí, borrar</button>
                <button id="modalCancelBtn">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- SCRIPT                                       -->
    <!-- ============================================ -->
    <script src="resumen-anual-asistencia.js"></script>

</body>
</html>
