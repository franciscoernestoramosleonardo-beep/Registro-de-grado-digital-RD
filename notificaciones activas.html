<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔔 Notificaciones Activas - Sistema Educativo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ============================================
           ESTILOS COMPLETOS
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(145deg, #f5f0eb 0%, #e8e0d8 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .notificaciones-container {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
        }

        /* ========== HEADER ========== */
        .notificaciones-header {
            background: linear-gradient(135deg, #1a2a4a 0%, #2a4a7a 100%);
            border-radius: 24px;
            padding: 28px 35px;
            margin-bottom: 25px;
            box-shadow: 0 12px 40px rgba(26, 42, 74, 0.25);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .notificaciones-header-left h1 {
            font-size: 2rem;
            font-weight: 800;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .notificaciones-header-left h1 span {
            background: rgba(255, 215, 0, 0.2);
            padding: 4px 16px;
            border-radius: 60px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #FFD700;
            border: 1px solid rgba(255, 215, 0, 0.3);
            animation: pulseBadge 2s infinite;
        }

        @keyframes pulseBadge {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .notificaciones-header-left p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .notificaciones-header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-marcar-todas {
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 60px;
            color: white;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn-marcar-todas:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn-tema {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 8px 16px;
            border-radius: 60px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s;
        }

        .btn-tema:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(15deg);
        }

        /* ========== ESTADÍSTICAS ========== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 16px 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 14px;
            transition: transform 0.2s;
            cursor: pointer;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .stat-card .icono {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .stat-card .icono.rojo { background: #fde8e8; color: #c0392b; }
        .stat-card .icono.amarillo { background: #fef9e7; color: #b7950b; }
        .stat-card .icono.verde { background: #e8f8f0; color: #1a7a4a; }
        .stat-card .icono.azul { background: #e8f0f8; color: #1a4a7a; }
        .stat-card .icono.morado { background: #f0e8f8; color: #6a2a8a; }

        .stat-card .info .numero {
            font-size: 1.6rem;
            font-weight: 800;
            color: #1a2a4a;
            line-height: 1.2;
        }

        .stat-card .info .label {
            font-size: 0.6rem;
            color: #718096;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ========== FILTROS POR CATEGORÍA ========== */
        .filtros-notificaciones {
            background: white;
            border-radius: 16px;
            padding: 12px 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 15px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .filtros-notificaciones label {
            font-weight: 600;
            font-size: 0.7rem;
            color: #1a2a4a;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filtros-notificaciones select {
            padding: 6px 14px;
            border-radius: 60px;
            border: 1.5px solid #e2e8f0;
            font-family: 'Inter', sans-serif;
            font-size: 0.78rem;
            background: #f7fafc;
            outline: none;
            cursor: pointer;
            min-width: 130px;
        }

        .filtros-notificaciones select:focus {
            border-color: #1a3a6b;
            box-shadow: 0 0 0 3px rgba(26, 58, 107, 0.1);
        }

        .btn-filtro-categoria {
            padding: 6px 16px;
            border-radius: 60px;
            border: 1.5px solid #e2e8f0;
            background: #f7fafc;
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: #1a2a4a;
        }

        .btn-filtro-categoria:hover {
            background: #e8ecf1;
            border-color: #1a3a6b;
        }

        .btn-filtro-categoria.activo {
            background: #1a3a6b;
            color: white;
            border-color: #1a3a6b;
        }

        /* ========== LISTA DE NOTIFICACIONES ========== */
        .notificaciones-list {
            background: white;
            border-radius: 20px;
            padding: 20px 24px 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .notificaciones-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .notificaciones-list-header h2 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1a2a4a;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .notificaciones-list-header h2 .badge {
            background: #dc3545;
            color: white;
            font-size: 0.6rem;
            padding: 2px 12px;
            border-radius: 60px;
            font-weight: 600;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.95); }
        }

        /* ========== NOTIFICACIÓN INDIVIDUAL ========== */
        .notificacion-item {
            display: flex;
            align-items: flex-start;
            padding: 14px 16px;
            border-radius: 14px;
            margin-bottom: 8px;
            background: #fafbfc;
            border: 1px solid #eef2f6;
            transition: all 0.3s ease;
            gap: 14px;
            cursor: pointer;
        }

        .notificacion-item:hover {
            background: #f0f4f8;
            border-color: #d0d8e0;
            transform: translateX(4px);
        }

        .notificacion-item.leida {
            opacity: 0.6;
            background: #f8f9fa;
        }

        .notificacion-item.leida:hover {
            opacity: 0.8;
        }

        .notificacion-item .icono-noti {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .notificacion-item .icono-noti.importante {
            background: #fde8e8;
            color: #c0392b;
        }
        .notificacion-item .icono-noti.media {
            background: #fef9e7;
            color: #b7950b;
        }
        .notificacion-item .icono-noti.informacion {
            background: #e8f0f8;
            color: #1a4a7a;
        }
        .notificacion-item .icono-noti.exito {
            background: #e8f8f0;
            color: #1a7a4a;
        }

        .notificacion-item .categoria-badge {
            font-size: 0.5rem;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 60px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            display: inline-block;
        }

        .notificacion-item .categoria-badge.estudiantes { background: #e8f0f8; color: #1a4a7a; }
        .notificacion-item .categoria-badge.asistencia { background: #fef9e7; color: #b7950b; }
        .notificacion-item .categoria-badge.evaluacion { background: #fde8e8; color: #c0392b; }
        .notificacion-item .categoria-badge.centro { background: #e8f8f0; color: #1a7a4a; }
        .notificacion-item .categoria-badge.sistema { background: #f0e8f8; color: #6a2a8a; }
        .notificacion-item .categoria-badge.cumpleanos { background: #fce4ec; color: #c62828; }
        .notificacion-item .categoria-badge.seguridad { background: #fde8e8; color: #c0392b; }
        .notificacion-item .categoria-badge.logros { background: #e8f8f0; color: #1a7a4a; }
        .notificacion-item .categoria-badge.rendimiento { background: #fef9e7; color: #b7950b; }
        .notificacion-item .categoria-badge.administrativas { background: #e8f0f8; color: #1a4a7a; }

        .notificacion-item .contenido {
            flex: 1;
            min-width: 0;
        }

        .notificacion-item .contenido .titulo {
            font-weight: 700;
            font-size: 0.9rem;
            color: #1a2a4a;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .notificacion-item .contenido .titulo .etiqueta {
            font-size: 0.55rem;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 60px;
            text-transform: uppercase;
        }

        .notificacion-item .contenido .titulo .etiqueta.hoy {
            background: #fde8e8;
            color: #c0392b;
            animation: pulse 1.5s infinite;
        }

        .notificacion-item .contenido .titulo .etiqueta.nueva {
            background: #e8f0f8;
            color: #1a4a7a;
        }

        .notificacion-item .contenido .titulo .etiqueta.urgente {
            background: #fde8e8;
            color: #c0392b;
            animation: pulse 1s infinite;
        }

        .notificacion-item .contenido .descripcion {
            font-size: 0.8rem;
            color: #4a5a6e;
            margin-top: 2px;
            line-height: 1.4;
        }

        .notificacion-item .contenido .fecha-hora {
            font-size: 0.65rem;
            color: #8a9aaa;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .notificacion-item .acciones-noti {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .notificacion-item .acciones-noti button {
            background: transparent;
            border: none;
            padding: 4px 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
            color: #8a9aaa;
        }

        .notificacion-item .acciones-noti button:hover {
            background: #e8ecf1;
            color: #1a2a4a;
        }

        .notificacion-item .acciones-noti button.leer:hover {
            background: #d4edda;
            color: #28a745;
        }

        .notificacion-item .acciones-noti button.eliminar:hover {
            background: #fde8e8;
            color: #c0392b;
        }

        /* ========== MENSAJE VACÍO ========== */
        .mensaje-vacio {
            text-align: center;
            padding: 40px 20px;
            color: #718096;
        }

        .mensaje-vacio .icono {
            font-size: 3.5rem;
            margin-bottom: 10px;
            opacity: 0.4;
        }

        .mensaje-vacio h3 {
            font-size: 1.1rem;
            color: #1a2a4a;
            margin-bottom: 4px;
        }

        .mensaje-vacio p {
            font-size: 0.85rem;
        }

        /* ========== TOAST ========== */
        .toast-mensaje {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a2a4a;
            color: white;
            padding: 12px 28px;
            border-radius: 60px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            z-index: 99999;
            font-weight: 500;
            max-width: 90%;
            text-align: center;
            animation: fadeInUp 0.3s ease;
        }

        .toast-mensaje.ocultar {
            animation: fadeOutDown 0.3s ease forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        @keyframes fadeOutDown {
            from { opacity: 1; transform: translateX(-50%) translateY(0); }
            to { opacity: 0; transform: translateX(-50%) translateY(20px); }
        }

        /* ========== MODO OSCURO ========== */
        body.modo-oscuro {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
        }
        body.modo-oscuro .notificaciones-header {
            background: linear-gradient(135deg, #0d1b2a, #1b3a5c);
        }
        body.modo-oscuro .stat-card {
            background: #1a1a2e;
            border-color: #2a2a4a;
        }
        body.modo-oscuro .stat-card .info .numero {
            color: #e8ecf1;
        }
        body.modo-oscuro .stat-card .info .label {
            color: #8a9aaa;
        }
        body.modo-oscuro .filtros-notificaciones {
            background: #1a1a2e;
            border-color: #2a2a4a;
        }
        body.modo-oscuro .filtros-notificaciones label {
            color: #e8ecf1;
        }
        body.modo-oscuro .filtros-notificaciones select {
            background: #2a2a4a;
            color: #e8ecf1;
            border-color: #3a3a5a;
        }
        body.modo-oscuro .notificaciones-list {
            background: #1a1a2e;
            border-color: #2a2a4a;
        }
        body.modo-oscuro .notificaciones-list-header h2 {
            color: #e8ecf1;
        }
        body.modo-oscuro .notificacion-item {
            background: #222244;
            border-color: #333355;
        }
        body.modo-oscuro .notificacion-item:hover {
            background: #2a2a55;
            border-color: #444477;
        }
        body.modo-oscuro .notificacion-item .contenido .titulo {
            color: #e8ecf1;
        }
        body.modo-oscuro .notificacion-item .contenido .descripcion {
            color: #8a9aaa;
        }
        body.modo-oscuro .notificacion-item .contenido .fecha-hora {
            color: #6a7a8a;
        }
        body.modo-oscuro .notificacion-item.leida {
            opacity: 0.5;
            background: #1a1a2e;
        }
        body.modo-oscuro .mensaje-vacio h3 {
            color: #e8ecf1;
        }
        body.modo-oscuro .mensaje-vacio p {
            color: #8a9aaa;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            .notificaciones-header {
                padding: 20px;
            }
            .notificaciones-header-left h1 {
                font-size: 1.5rem;
                flex-wrap: wrap;
            }
            .notificaciones-header-left h1 span {
                font-size: 0.6rem;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .notificacion-item {
                padding: 12px 14px;
                gap: 12px;
                flex-wrap: wrap;
            }
            .notificacion-item .acciones-noti {
                width: 100%;
                justify-content: flex-end;
            }
            .filtros-notificaciones {
                flex-direction: column;
                align-items: stretch;
            }
            .filtros-notificaciones select {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .notificaciones-header-left h1 {
                font-size: 1.2rem;
            }
            .notificacion-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .notificacion-item .acciones-noti {
                width: 100%;
                justify-content: flex-start;
            }
            .btn-filtro-categoria {
                font-size: 0.6rem;
                padding: 4px 12px;
            }
        }
    </style>
</head>
<body>

    <div class="notificaciones-container">

        <!-- HEADER -->
        <div class="notificaciones-header">
            <div class="notificaciones-header-left">
                <h1>
                    🔔 Notificaciones Activas
                    <span id="badgeNotificaciones">12 nuevas</span>
                </h1>
                <p><i class="fas fa-bell" style="color:#FFD700;"></i> Mantente al día con lo que sucede en tu clase</p>
            </div>
            <div class="notificaciones-header-right">
                <button class="btn-marcar-todas" id="btnMarcarTodas">
                    <i class="fas fa-check-double"></i> Marcar todas como leídas
                </button>
                <button class="btn-tema" id="btnTema" title="Cambiar tema">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>

        <!-- ESTADÍSTICAS -->
        <div class="stats-grid">
            <div class="stat-card" data-filtro="todas">
                <div class="icono rojo">🔔</div>
                <div class="info">
                    <div class="numero" id="totalNotificaciones">0</div>
                    <div class="label">Total</div>
                </div>
            </div>
            <div class="stat-card" data-filtro="importante">
                <div class="icono amarillo">🔴</div>
                <div class="info">
                    <div class="numero" id="notificacionesImportantes">0</div>
                    <div class="label">Importantes</div>
                </div>
            </div>
            <div class="stat-card" data-filtro="no-leidas">
                <div class="icono verde">📩</div>
                <div class="info">
                    <div class="numero" id="notificacionesNoLeidas">0</div>
                    <div class="label">No leídas</div>
                </div>
            </div>
            <div class="stat-card" data-filtro="hoy">
                <div class="icono azul">📅</div>
                <div class="info">
                    <div class="numero" id="notificacionesHoy">0</div>
                    <div class="label">De hoy</div>
                </div>
            </div>
        </div>

        <!-- FILTROS POR CATEGORÍA -->
        <div class="filtros-notificaciones">
            <label>
                <i class="fas fa-filter"></i> Categoría:
                <select id="filtroCategoria">
                    <option value="todas">📋 Todas</option>
                    <option value="estudiantes">📚 Estudiantes</option>
                    <option value="asistencia">📊 Asistencia</option>
                    <option value="evaluacion">📝 Evaluación</option>
                    <option value="centro">🏫 Centro</option>
                    <option value="sistema">💻 Sistema</option>
                    <option value="cumpleanos">🎂 Cumpleaños</option>
                    <option value="seguridad">🔐 Seguridad</option>
                    <option value="logros">🏆 Logros</option>
                    <option value="rendimiento">📈 Rendimiento</option>
                    <option value="administrativas">📋 Administrativas</option>
                </select>
            </label>
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
                <button class="btn-filtro-categoria activo" data-categoria="todas">📋 Todas</button>
                <button class="btn-filtro-categoria" data-categoria="estudiantes">📚 Estudiantes</button>
                <button class="btn-filtro-categoria" data-categoria="asistencia">📊 Asistencia</button>
                <button class="btn-filtro-categoria" data-categoria="evaluacion">📝 Evaluación</button>
                <button class="btn-filtro-categoria" data-categoria="cumpleanos">🎂 Cumpleaños</button>
            </div>
            <button class="btn-marcar-todas" id="btnLimpiarFiltros" style="background:#e8ecf1;color:#1a2a4a;border-color:#d0d8e0;padding:4px 14px;font-size:0.7rem;">
                <i class="fas fa-undo"></i> Reset
            </button>
        </div>

        <!-- LISTA DE NOTIFICACIONES -->
        <div class="notificaciones-list">
            <div class="notificaciones-list-header">
                <h2>
                    📋 Lista de Notificaciones
                    <span class="badge" id="contadorNotificaciones">0</span>
                </h2>
            </div>

            <div id="listaNotificaciones">
                <!-- Las notificaciones se renderizan aquí con JavaScript -->
            </div>
        </div>

    </div>

    <!-- ========== SCRIPT COMPLETO ========== -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            'use strict';

            // ============================================
            // 📦 NOTIFICACIONES POR CATEGORÍA
            // ============================================
            let notificaciones = [
                // ==================== CATEGORÍA: ESTUDIANTES ====================
                {
                    id: 1,
                    categoria: 'estudiantes',

            const STORAGE_KEY = 'notificaciones_filtro_activo';

            // ============================================
            // FUNCIONES
            // ============================================

            function getTipoClase(tipo) {
                const tipos = {
                    importante: 'importante',
                    media: 'media',
                    informacion: 'informacion',
                    exito: 'exito'
                };
                return tipos[tipo] || 'informacion';
            }

            function getCategoriaClase(categoria) {
                const clases = {
                    estudiantes: 'estudiantes',
                    asistencia: 'asistencia',
                    evaluacion: 'evaluacion',
                    centro: 'centro',
                    sistema: 'sistema',
                    cumpleanos: 'cumpleanos',
                    seguridad: 'seguridad',
                    logros: 'logros',
                    rendimiento: 'rendimiento',
                    administrativas: 'administrativas'
                };
                return clases[categoria] || 'estudiantes';
            }

            function getCategoriaIcono(categoria) {
                const iconos = {
                    estudiantes: '📚',
                    asistencia: '📊',
                    evaluacion: '📝',
                    centro: '🏫',
                    sistema: '💻',
                    cumpleanos: '🎂',
                    seguridad: '🔐',
                    logros: '🏆',
                    rendimiento: '📈',
                    administrativas: '📋'
                };
                return iconos[categoria] || '📌';
            }

            function getCategoriaNombre(categoria) {
                const nombres = {
                    estudiantes: 'Estudiantes',
                    asistencia: 'Asistencia',
                    evaluacion: 'Evaluación',
                    centro: 'Centro',
                    sistema: 'Sistema',
                    cumpleanos: 'Cumpleaños',
                    seguridad: 'Seguridad',
                    logros: 'Logros',
                    rendimiento: 'Rendimiento',
                    administrativas: 'Administrativas'
                };
                return nombres[categoria] || 'General';
            }

            function actualizarEstadisticas() {
                const total = notificaciones.length;
                const importantes = notificaciones.filter(n => n.tipo === 'importante').length;
                const noLeidas = notificaciones.filter(n => !n.leida).length;
                const hoy = notificaciones.filter(n => n.etiqueta === 'hoy' || n.etiqueta === 'urgente').length;

                document.getElementById('totalNotificaciones').textContent = total;
                document.getElementById('notificacionesImportantes').textContent = importantes;
                document.getElementById('notificacionesNoLeidas').textContent = noLeidas;
                document.getElementById('notificacionesHoy').textContent = hoy;

                const badge = document.getElementById('badgeNotificaciones');
                if (noLeidas > 0) {
                    badge.textContent = `${noLeidas} nuevas`;
                    badge.style.animation = 'pulseBadge 1.5s infinite';
                } else {
                    badge.textContent = '🔔 Sin nuevas';
                    badge.style.animation = 'none';
                }

                document.getElementById('contadorNotificaciones').textContent = total;
            }

            // ============================================
            // 📌 GUARDAR Y CARGAR FILTRO EN localStorage
            // ============================================
            function guardarFiltro(filtro) {
                try {
                    localStorage.setItem(STORAGE_KEY, filtro);
                } catch(e) {}
            }

            function cargarFiltroGuardado() {
                try {
                    return localStorage.getItem(STORAGE_KEY) || 'todas';
                } catch(e) {
                    return 'todas';
                }
            }

            function renderizarNotificaciones(filtro = 'todas') {
                const container = document.getElementById('listaNotificaciones');

                let filtradas = [...notificaciones];

                if (filtro !== 'todas') {
                    if (filtro === 'importante') {
                        filtradas = filtradas.filter(n => n.tipo === 'importante');
                    } else if (filtro === 'no-leidas') {
                        filtradas = filtradas.filter(n => !n.leida);
                    } else if (filtro === 'hoy') {
                        filtradas = filtradas.filter(n => n.etiqueta === 'hoy' || n.etiqueta === 'urgente');
                    } else {
                        // Filtro por categoría
                        filtradas = filtradas.filter(n => n.categoria === filtro);
                    }
                }

                // Ordenar: no leídas primero, luego por fecha
                filtradas.sort((a, b) => {
                    if (a.leida !== b.leida) return a.leida ? 1 : -1;
                    return 0;
                });

                if (filtradas.length === 0) {
                    container.innerHTML = `
                        <div class="mensaje-vacio">
                            <div class="icono">🔔</div>
                            <h3>No hay notificaciones</h3>
                            <p>${filtro === 'todas' ? 'Todas las notificaciones han sido leídas.' : 'No hay notificaciones en esta categoría.'}</p>
                        </div>
                    `;
                    actualizarEstadisticas();
                    return;
                }

                container.innerHTML = filtradas.map(n => {
                    const tipoClase = getTipoClase(n.tipo);
                    const categoriaClase = getCategoriaClase(n.categoria);
                    const leidaClase = n.leida ? 'leida' : '';
                    const categoriaIcono = getCategoriaIcono(n.categoria);
                    const categoriaNombre = getCategoriaNombre(n.categoria);
                    
                    let etiquetaHTML = '';
                    if (n.etiqueta === 'hoy') etiquetaHTML = `<span class="etiqueta hoy">🎈 Hoy</span>`;
                    else if (n.etiqueta === 'nueva') etiquetaHTML = `<span class="etiqueta nueva">🆕 Nueva</span>`;
                    else if (n.etiqueta === 'urgente') etiquetaHTML = `<span class="etiqueta urgente">⚠️ Urgente</span>`;

                    return `
                        <div class="notificacion-item ${leidaClase}" data-id="${n.id}">
                            <div class="icono-noti ${tipoClase}">
                                ${n.icono}
                            </div>
                            <div class="contenido">
                                <div class="titulo">
                                    ${n.titulo}
                                    ${etiquetaHTML}
                                    <span class="categoria-badge ${categoriaClase}">${categoriaIcono} ${categoriaNombre}</span>
                                </div>
                                <div class="descripcion">${n.descripcion}</div>
                                <div class="fecha-hora">
                                    <i class="fas fa-calendar-alt"></i> ${n.fecha}
                                    <i class="fas fa-clock" style="margin-left:8px;"></i> ${n.hora}
                                </div>
                            </div>
                            <div class="acciones-noti">
                                ${!n.leida ? `<button class="leer" data-id="${n.id}" title="Marcar como leída"><i class="fas fa-check"></i></button>` : ''}
                                <button class="eliminar" data-id="${n.id}" title="Eliminar notificación"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </div>
                    `;
                }).join('');

                // Eventos
                container.querySelectorAll('.leer').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id);
                        marcarComoLeida(id);
                    });
                });

                container.querySelectorAll('.eliminar').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id);
                        eliminarNotificacion(id);
                    });
                });

                container.querySelectorAll('.notificacion-item').forEach(item => {
                    item.addEventListener('click', function() {
                        const id = parseInt(this.dataset.id);
                        const noti = notificaciones.find(n => n.id === id);
                        if (noti && !noti.leida) {
                            marcarComoLeida(id);
                        }
                    });
                });

                actualizarEstadisticas();
            }

            function marcarComoLeida(id) {
                const noti = notificaciones.find(n => n.id === id);
                if (noti) {
                    noti.leida = true;
                    mostrarToast(`✅ Notificación marcada como leída: "${noti.titulo}"`);
                    const filtro = document.getElementById('filtroCategoria').value;
                    renderizarNotificaciones(filtro);
                }
            }

            function eliminarNotificacion(id) {
                const noti = notificaciones.find(n => n.id === id);
                if (noti && confirm(`¿Eliminar esta notificación?\n\n"${noti.titulo}"`)) {
                    notificaciones = notificaciones.filter(n => n.id !== id);
                    mostrarToast(`🗑️ Notificación eliminada: "${noti.titulo}"`);
                    const filtro = document.getElementById('filtroCategoria').value;
                    renderizarNotificaciones(filtro);
                }
            }

            function marcarTodasComoLeidas() {
                const noLeidas = notificaciones.filter(n => !n.leida);
                if (noLeidas.length === 0) {
                    mostrarToast('📭 No hay notificaciones sin leer.');
                    return;
                }
                notificaciones.forEach(n => n.leida = true);
                mostrarToast(`✅ ${noLeidas.length} notificaciones marcadas como leídas.`);
                const filtro = document.getElementById('filtroCategoria').value;
                renderizarNotificaciones(filtro);
            }

            // ============================================
            // TOAST
            // ============================================
            function mostrarToast(mensaje) {
                const toastAnterior = document.querySelector('.toast-mensaje');
                if (toastAnterior) {
                    toastAnterior.remove();
                }

                const toast = document.createElement('div');
                toast.className = 'toast-mensaje';
                toast.textContent = mensaje;
                document.body.appendChild(toast);

                setTimeout(() => {
                    toast.classList.add('ocultar');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }

            // ============================================
            // EVENTOS
            // ============================================

            // Filtro por categoría (Select)
            document.getElementById('filtroCategoria').addEventListener('change', function() {
                const categoria = this.value;
                // Guardar en localStorage
                guardarFiltro(categoria);
                // Actualizar botones activos
                document.querySelectorAll('.btn-filtro-categoria').forEach(btn => {
                    btn.classList.toggle('activo', btn.dataset.categoria === categoria);
                });
                renderizarNotificaciones(categoria);
            });

            // Botones de categoría
            document.querySelectorAll('.btn-filtro-categoria').forEach(btn => {
                btn.addEventListener('click', function() {
                    const categoria = this.dataset.categoria;
                    document.getElementById('filtroCategoria').value = categoria;
                    // Guardar en localStorage
                    guardarFiltro(categoria);
                    document.querySelectorAll('.btn-filtro-categoria').forEach(b => b.classList.remove('activo'));
                    this.classList.add('activo');
                    renderizarNotificaciones(categoria);
                    mostrarToast(`📋 Filtrado: ${getCategoriaNombre(categoria)}`);
                });
            });

            // Reset filtros
            document.getElementById('btnLimpiarFiltros').addEventListener('click', function() {
                document.getElementById('filtroCategoria').value = 'todas';
                guardarFiltro('todas');
                document.querySelectorAll('.btn-filtro-categoria').forEach(b => b.classList.remove('activo'));
                document.querySelector('.btn-filtro-categoria[data-categoria="todas"]').classList.add('activo');
                renderizarNotificaciones('todas');
                mostrarToast('🔄 Filtros restablecidos');
            });

            // Marcar todas como leídas
            document.getElementById('btnMarcarTodas').addEventListener('click', marcarTodasComoLeidas);

            // Tema oscuro
            document.getElementById('btnTema').addEventListener('click', function() {
                temaOscuro = !temaOscuro;
                document.body.classList.toggle('modo-oscuro', temaOscuro);
                this.innerHTML = temaOscuro ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
                mostrarToast(temaOscuro ? '🌙 Modo oscuro activado' : '☀️ Modo claro activado');
            });

            // Estadísticas clickeables (filtran)
            document.querySelectorAll('.stat-card').forEach(card => {
                card.addEventListener('click', function() {
                    const filtro = this.dataset.filtro;
                    document.getElementById('filtroCategoria').value = filtro;
                    guardarFiltro(filtro);
                    document.querySelectorAll('.btn-filtro-categoria').forEach(b => b.classList.remove('activo'));
                    renderizarNotificaciones(filtro);
                    mostrarToast(`📋 Filtrado: ${this.querySelector('.label').textContent}`);
                });
            });

            // ============================================
            // INICIALIZACIÓN
            // ============================================
            // Cargar filtro guardado
            const filtroGuardado = cargarFiltroGuardado();
            
            // Establecer el filtro en el select
            document.getElementById('filtroCategoria').value = filtroGuardado;
            
            // Activar el botón correspondiente
            document.querySelectorAll('.btn-filtro-categoria').forEach(b => {
                b.classList.toggle('activo', b.dataset.categoria === filtroGuardado);
            });
            
            // Renderizar con el filtro guardado
            renderizarNotificaciones(filtroGuardado);

            console.log('🔔 Notificaciones Activas - Sistema Educativo');
            console.log(`📊 ${notificaciones.length} notificaciones disponibles`);
            console.log(`📩 ${notificaciones.filter(n => !n.leida).length} no leídas`);
            console.log(`📌 Filtro guardado: ${filtroGuardado}`);
            console.log('📂 Categorías: Estudiantes, Asistencia, Evaluación, Centro, Sistema, Cumpleaños, Seguridad, Logros, Rendimiento, Administrativas');
            console.log('💾 El filtro se mantiene al recargar la página');

        });
    </script>

</body>
</html>
